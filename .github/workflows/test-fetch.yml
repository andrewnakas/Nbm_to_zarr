name: Test Data Fetch

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:  # Allow manual triggering

jobs:
  test-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install package
        run: |
          uv pip install --system -e .

      - name: Create test directories
        run: |
          mkdir -p test_data
          mkdir -p test_downloads

      - name: Show dataset info
        run: |
          nbm-zarr info noaa-nbm-conus-forecast

      - name: Test basic template creation
        run: |
          echo "Testing basic template creation..."
          python scripts/test_basic.py

      - name: Verify nbm-zarr command
        run: |
          echo "Checking if nbm-zarr command is available..."
          which nbm-zarr || echo "nbm-zarr not found in PATH"
          nbm-zarr --help || echo "nbm-zarr --help failed"

      - name: Test data fetch (single forecast)
        timeout-minutes: 60
        run: |
          echo "Testing NBM data download and processing..."
          set -x  # Enable command echoing
          nbm-zarr operational-update --dataset-id noaa-nbm-conus-forecast --output-dir ./test_data 2>&1 | tee test_output.log || {
            echo "Command failed with exit code $?"
            echo "Attempting to run directly to see error..."
            python -m nbm_to_zarr operational-update --dataset-id noaa-nbm-conus-forecast --output-dir ./test_data
          }
          echo "Exit code: $?"

      - name: Check output
        if: always()
        run: |
          echo "=== Command Output Log ==="
          cat test_output.log || echo "No log file found"

          echo ""
          echo "=== Test Data Directory Contents ==="
          ls -lh test_data/ || echo "No test_data directory"

          echo ""
          echo "=== Download Directory Contents ==="
          ls -lh /tmp/nbm_downloads/ 2>/dev/null || echo "No download directory"

          if [ -d "test_data/noaa-nbm-conus-forecast.zarr" ]; then
            echo "=== Zarr Store Created Successfully ==="
            du -sh test_data/noaa-nbm-conus-forecast.zarr
            find test_data/noaa-nbm-conus-forecast.zarr -type f | head -20
          else
            echo "=== ERROR: Zarr store was not created ==="
            echo "Checking for Python errors..."
            grep -i "error\|exception\|traceback" test_output.log || echo "No obvious errors in log"
            exit 1
          fi

      - name: Verify data with Python
        if: success()
        run: |
          python3 << 'EOF'
          import xarray as xr
          from pathlib import Path

          zarr_path = Path("test_data/noaa-nbm-conus-forecast.zarr")

          try:
              ds = xr.open_zarr(zarr_path, consolidated=True)
              print("\n=== Dataset Info ===")
              print(f"Dimensions: {dict(ds.dims)}")
              print(f"Variables: {list(ds.data_vars.keys())}")
              print(f"Coordinates: {list(ds.coords.keys())}")

              print("\n=== Init Times ===")
              print(ds.init_time.values)

              print("\n=== Data Variables with Non-NaN Values ===")
              for var in ds.data_vars:
                  non_nan_count = (~ds[var].isnull()).sum().values
                  total_count = ds[var].size
                  pct = (non_nan_count / total_count) * 100
                  print(f"{var}: {non_nan_count}/{total_count} ({pct:.1f}% populated)")

              ds.close()
              print("\n✅ Data fetch test PASSED!")
          except Exception as e:
              print(f"\n❌ Data fetch test FAILED: {e}")
              import traceback
              traceback.print_exc()
              exit(1)
          EOF

      - name: Upload test data as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-nbm-data
          path: |
            test_data/
            test_output.log
            /tmp/nbm_downloads/
          retention-days: 1
